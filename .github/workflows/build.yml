name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 16.5MB 的 moc3 不进仓库，编译时从镜像下载
      - name: fetch live2d moc3
        run: |
          mkdir -p app/src/main/assets/live2d
          curl -fsSL --retry 5 --retry-all-errors \
            -o app/src/main/assets/live2d/dafeiyu.moc3 \
            "https://raw.githubusercontent.com/YJackie-Li/DeepSeek-chan/main/%E5%A4%A7%E8%82%A5%E9%B1%BC.moc3"
          ls -l app/src/main/assets/live2d/dafeiyu.moc3

      - name: build debug apk
        run: gradle :app:assembleDebug --stacktrace

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: dsh-whale-apk
          path: app/build/outputs/apk/debug/*.apk
